<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>CS Geek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a full-screen pixel ocean the camera descends through; HUD on top, prompt card centre, input dock at the bottom. */
:root {
  color-scheme: dark;
  --deep: #050a14;
  --card: rgba(10, 17, 32, 0.90);
  --ink: #e6ecf6;
  --muted: #8a96b0;
  --line: #2b3854;
  --cyan: #4fd6ec;
  --pink: #ff5c8a;
  --t-common: #4fd6ec;
  --t-uncommon: #b78cff;
  --t-rare: #ff5c8a;
  --t-legendary: #ffb547;
  --t-miss: #8a96b0;
  --f-pixel: "Silkscreen", "Courier New", monospace;
  --f-num: "Pixelify Sans", "Courier New", monospace;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--deep); color: var(--ink); font-family: var(--f-mono); font-size: 15px; line-height: 1.5; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; z-index: 0; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.13) 2px 3px); }
button { font: 400 0.85rem var(--f-pixel); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); background: rgba(12, 20, 38, 0.92); border: 2px solid var(--line); padding: 10px 16px; cursor: pointer; }
button:hover { border-color: var(--cyan); color: #fff; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
.iconbtn { position: fixed; z-index: 30; width: 46px; height: 46px; padding: 0; display: grid; place-items: center; font-size: 1.1rem; letter-spacing: 0; }
#home { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); }
#mute { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); }
.chip-x { clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }

/* HUD */
#hud { position: fixed; z-index: 20; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(760px, calc(100% - 140px)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px; pointer-events: none; }
.gauge { background: var(--card); padding: 8px 16px 10px; min-width: 120px; display: grid; gap: 2px; }
.gauge.right { justify-self: end; text-align: right; }
.gauge span { font-family: var(--f-pixel); font-size: 0.62rem; letter-spacing: 0.28em; color: var(--muted); }
.gauge b { font-family: var(--f-num); font-weight: 700; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.gauge.left b { color: var(--cyan); text-shadow: 0 0 12px rgba(79,214,236,0.5); }
.gauge.right b { color: var(--pink); text-shadow: 0 0 12px rgba(255,92,138,0.5); }
.pipsbox { display: grid; justify-items: center; gap: 6px; padding-top: 6px; }
#pips { display: flex; gap: 4px; }
#pips i { width: 16px; height: 16px; background: #0d1628; border: 2px solid #1e2a44; }
#pips i.now { border-color: var(--pink); background: var(--pink); animation: pulse 1s steps(2) infinite; }
#pips i.common { background: var(--t-common); border-color: var(--t-common); }
#pips i.uncommon { background: var(--t-uncommon); border-color: var(--t-uncommon); }
#pips i.rare { background: var(--t-rare); border-color: var(--t-rare); }
#pips i.legendary { background: var(--t-legendary); border-color: var(--t-legendary); }
#pips i.miss { background: #0d1628; border-color: var(--muted); }
#hPrompt { font-family: var(--f-pixel); font-size: 0.6rem; letter-spacing: 0.25em; color: var(--ink); text-shadow: 0 1px 0 #000; }
@keyframes pulse { 50% { opacity: 0.45; } }
@media (max-width: 600px) { #hud { width: calc(100% - 120px); grid-template-columns: 1fr 1fr; } .pipsbox { display: none; } .gauge { min-width: 0; padding: 6px 10px; } .gauge b { font-size: 1.35rem; } }

/* stage */
#stage { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 90px 130px; pointer-events: none; }
#stage > * { pointer-events: auto; }
#stage.scroll { place-items: start center; overflow-y: auto; padding-block: 80px 60px; }

/* title */
.titlewrap { width: min(980px, 100%); align-self: stretch; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; text-align: center; }
.logo { font-family: var(--f-pixel); font-weight: 700; font-size: clamp(2.2rem, 8.4vw, 5.6rem); line-height: 1; margin: 0; white-space: nowrap; color: #fff; letter-spacing: 0.04em; position: relative; text-shadow: 4px 0 0 var(--pink), -4px 0 0 var(--cyan); animation: glitch 4s steps(1) infinite; }
@keyframes glitch { 0%, 92%, 100% { text-shadow: 4px 0 0 var(--pink), -4px 0 0 var(--cyan); transform: none; } 93% { text-shadow: -6px 0 0 var(--pink), 6px 0 0 var(--cyan); transform: translateX(3px) skewX(-6deg); } 95% { text-shadow: 8px 2px 0 var(--pink), -2px -2px 0 var(--cyan); transform: translateX(-4px); } 97% { text-shadow: 2px 0 0 var(--pink), -2px 0 0 var(--cyan); transform: none; } }
.gswitch { display: inline-flex; margin-top: 18px; padding: 4px; gap: 4px; border: 2px solid var(--cyan); background: rgba(6, 14, 34, 0.75); font-family: var(--f-pixel); font-size: 0.85rem; letter-spacing: 0.18em; }
.gswitch > * { padding: 7px 14px; color: var(--cyan); text-decoration: none; }
.gswitch .on { background: var(--cyan); color: #06122a; }
.gswitch a:hover, .gswitch a:focus-visible { background: rgba(79, 214, 236, 0.18); outline: none; }
.sub { font-family: var(--f-pixel); font-size: clamp(1rem, 3.4vw, 1.6rem); letter-spacing: 0.4em; color: var(--cyan); text-shadow: 0 2px 0 #0b1530; margin-top: 10px; }
.tag { font-family: var(--f-mono); font-weight: 600; letter-spacing: 0.12em; color: #fff; text-shadow: 0 1px 2px #1a1030; margin-top: 12px; }
.menu { display: grid; gap: 12px; text-align: left; width: min(760px, 100%); justify-self: center; }
.howto { background: var(--card); border: 2px solid var(--line); padding: 10px 14px; }
.howto summary { font-family: var(--f-pixel); font-size: 0.75rem; letter-spacing: 0.2em; cursor: pointer; color: var(--muted); }
.howto ol { margin: 10px 0 2px; padding-left: 20px; display: grid; gap: 6px; font-size: 0.9rem; }
.bigbtn { width: 100%; font-size: clamp(1.1rem, 3.6vw, 1.7rem); letter-spacing: 0.25em; padding: 24px 12px; border: 4px solid var(--cyan); background: rgba(12, 22, 42, 0.95); color: #fff; box-shadow: 0 0 24px rgba(79,214,236,0.35), inset 0 0 18px rgba(79,214,236,0.12); animation: breathe 2.4s ease-in-out infinite; }
.bigbtn:hover { background: #12234a; }
@keyframes breathe { 50% { box-shadow: 0 0 40px rgba(79,214,236,0.55), inset 0 0 22px rgba(79,214,236,0.2); } }
.menurow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.menurow .daylbl { font-family: var(--f-pixel); font-size: 0.72rem; letter-spacing: 0.22em; color: var(--muted); margin-right: auto; }
.packgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; background: var(--card); border: 2px solid var(--line); padding: 12px; }
.packgrid button { text-align: left; font-size: 0.7rem; letter-spacing: 0.08em; display: flex; justify-content: space-between; gap: 8px; }
.packgrid button small { color: var(--muted); }

/* prompt + reveal */
.pcard { width: min(760px, 100%); background: var(--card); padding: 26px 32px 22px; display: grid; gap: 14px; box-shadow: 0 10px 0 rgba(0,0,0,0.25); }
.pcard .eyebrow { font-family: var(--f-pixel); font-size: 0.78rem; letter-spacing: 0.3em; color: var(--pink); }
.pcard .eyebrow span { color: var(--muted); }
.ptext { font-family: var(--f-num); font-weight: 700; font-size: clamp(1.5rem, 4.4vw, 2.5rem); line-height: 1.2; text-wrap: balance; min-height: 1.2em; }
.ptext .cursor { display: inline-block; width: 0.5em; height: 0.9em; background: var(--cyan); vertical-align: -0.08em; animation: pulse 0.6s steps(2) infinite; }
.sinkhint { font-family: var(--f-mono); font-size: 0.85rem; letter-spacing: 0.18em; color: var(--muted); }
.fb { min-height: 1.4em; font-size: 0.92rem; color: var(--pink); }
.fb .why { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
.fb.in { animation: fbin 0.25s steps(3); }
@keyframes fbin { from { transform: translateX(-8px); opacity: 0; } }
.shake { animation: shake 0.32s steps(6); }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.enter { animation: enter 0.45s cubic-bezier(.2,.9,.3,1.2); }
@keyframes enter { from { transform: translateY(40px) scale(0.96); opacity: 0; } }

.reveal { display: grid; justify-items: center; gap: 12px; text-align: center; width: min(640px, 100%); }
.creature { width: 156px; height: auto; image-rendering: pixelated; animation: bob 2.2s ease-in-out infinite, pop 0.5s cubic-bezier(.2,1.6,.4,1); }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes pop { from { transform: scale(0.2); opacity: 0; } }
.zone { font-family: var(--f-pixel); font-weight: 700; font-size: clamp(1.8rem, 6vw, 3rem); letter-spacing: 0.18em; line-height: 1.1; }
.quote { font-family: var(--f-num); font-size: 1.6rem; }
.gain { font-family: var(--f-num); font-size: 1.9rem; font-weight: 700; }
.gain span { color: var(--ink); font-weight: 500; }
.flav { font-family: var(--f-mono); letter-spacing: 0.14em; color: var(--muted); }
.most { font-size: 0.82rem; color: var(--muted); max-width: 52ch; }
.c-common { color: var(--t-common); } .c-uncommon { color: var(--t-uncommon); } .c-rare { color: var(--t-rare); } .c-legendary { color: var(--t-legendary); } .c-miss { color: var(--t-miss); }
.glow-common { filter: drop-shadow(0 0 14px var(--t-common)); text-shadow: 0 0 18px var(--t-common); }
.glow-uncommon { filter: drop-shadow(0 0 14px var(--t-uncommon)); text-shadow: 0 0 18px var(--t-uncommon); }
.glow-rare { filter: drop-shadow(0 0 16px var(--t-rare)); text-shadow: 0 0 18px var(--t-rare); }
.glow-legendary { filter: drop-shadow(0 0 20px var(--t-legendary)); text-shadow: 0 0 22px var(--t-legendary); }

/* dock */
#dock { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(to bottom, rgba(5,10,20,0), rgba(5,10,20,0.92) 40%); display: flex; justify-content: center; }
.dockrow { width: min(760px, 100%); display: flex; align-items: center; gap: 12px; }
.ring { position: relative; width: 64px; height: 64px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-num); font-size: 1.5rem; color: var(--cyan); }
.ring.low b { color: var(--pink); animation: pulse 0.5s steps(2) infinite; }
#guess { flex: 1; min-width: 0; font: 600 1.25rem var(--f-mono); padding: 16px 16px; color: #fff; background: #0a1224; border: 3px solid var(--cyan); }
#guess::placeholder { color: #4a5878; }
.send { background: var(--pink); border-color: var(--pink); color: #12081a; font-size: 1rem; padding: 18px 22px; box-shadow: 0 4px 0 #8a2346; }
.send:hover { color: #000; border-color: #fff; }
.pass { padding: 18px 12px; font-size: 0.7rem; }
.countchip { font-family: var(--f-mono); letter-spacing: 0.2em; background: var(--card); padding: 14px 26px; }
.countchip b { color: var(--cyan); font-family: var(--f-num); font-size: 1.2rem; }
.descend { min-width: min(320px, 100%); font-size: 1.15rem; padding: 20px 26px; border: 4px solid var(--cyan); background: rgba(12,22,42,0.95); box-shadow: 0 0 22px rgba(79,214,236,0.35); }
@media (max-width: 520px) { .pass { display: none; } .ring { width: 52px; height: 52px; } .send { padding: 16px 14px; } #guess { font-size: 1.05rem; padding: 13px; } }

/* now playing (Sally) */
#np { position: fixed; z-index: 25; left: max(14px, env(safe-area-inset-left, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); width: 250px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--card); padding: 8px 12px 8px 8px; border-left: 3px solid #1ed760; }
#np img, #np > i { width: 52px; height: 52px; object-fit: cover; display: block; background: #1c2a44; }
#np .npt { display: grid; gap: 1px; min-width: 0; }
#np .npt > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#np .npl { font-family: var(--f-pixel); font-size: 0.55rem; letter-spacing: 0.22em; color: #1ed760; }
#np b { font-size: 0.85rem; }
#np span { font-size: 0.75rem; color: var(--muted); }
#np .npbar { height: 3px; background: #1c2a44; margin-top: 4px; }
#np .npbar i { display: block; height: 100%; width: 0; background: #1ed760; }
#np.paused { border-left-color: var(--muted); } #np.paused .npl { color: var(--muted); }
@media (max-width: 900px) { #np { top: auto; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); width: 220px; } }

/* results */
.results { width: min(760px, 100%); display: grid; gap: 26px; padding-bottom: 40px; }
.rhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.rhead .brand { font-family: var(--f-pixel); font-weight: 700; font-size: 1.6rem; color: #fff; text-shadow: 2px 0 0 var(--pink), -2px 0 0 var(--cyan); }
.rhead .done { font-family: var(--f-pixel); font-size: 0.75rem; letter-spacing: 0.3em; color: var(--muted); }
.bigscore { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.bigscore b { font-family: var(--f-num); font-weight: 700; font-size: clamp(4.5rem, 18vw, 8rem); line-height: 0.85; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 4px 4px 0 #000; }
.bigscore span { font-family: var(--f-pixel); color: var(--cyan); padding-bottom: 6px; letter-spacing: 0.1em; }
.better { font-family: var(--f-pixel); letter-spacing: 0.22em; color: var(--cyan); font-size: 0.95rem; text-shadow: 0 0 12px rgba(79,214,236,0.5); }
.verdict { color: var(--ink); }
.sect { display: grid; gap: 14px; }
.sect h2 { margin: 0; font-family: var(--f-pixel); font-weight: 400; font-size: 0.9rem; letter-spacing: 0.28em; display: flex; align-items: center; gap: 14px; }
.sect h2 small { color: var(--muted); font-size: 0.8em; }
.sect h2::after { content: ""; flex: 1; border-top: 2px dashed var(--line); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--f-pixel); font-size: 10px; fill: var(--muted); letter-spacing: 0.08em; }
.chart text.you { fill: var(--pink); font-size: 12px; }
.chart text.lab { fill: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--card); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.stat span { font-family: var(--f-pixel); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--muted); }
.stat b { font-family: var(--f-num); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.topics { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: 200px minmax(0, 1fr) 70px; gap: 12px; align-items: center; font-size: 0.85rem; }
@media (max-width: 560px) { .trow { grid-template-columns: 1fr 64px; } .trow .track { grid-column: 1 / -1; grid-row: 2; } .stats { grid-template-columns: 1fr 1fr; } }
.track { position: relative; height: 10px; background: #0a1224; border: 1px solid var(--line); }
.track .you { position: absolute; inset: 0 auto 0 0; background: var(--cyan); }
.track .joe { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--pink); }
.trow .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.8rem; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 8px; background: var(--cyan); margin-right: 6px; vertical-align: middle; }
.legend i.joe { width: 3px; height: 12px; background: var(--pink); }
pre.share { margin: 0; font-family: var(--f-mono); font-size: 0.95rem; background: var(--card); padding: 14px 16px; white-space: pre-wrap; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.review { display: grid; }
.rv { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 12px 0; border-top: 1px dashed var(--line); }
.rv img { width: 36px; image-rendering: pixelated; grid-row: 1 / span 2; }
.rv .q { font-weight: 600; }
.rv .a { font-size: 0.8rem; color: var(--muted); grid-column: 2; }
.rv .p { grid-row: 1 / span 2; grid-column: 3; font-family: var(--f-num); font-size: 1.2rem; }
.note { font-size: 0.78rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<canvas id="world" aria-hidden="true"></canvas>
<button class="iconbtn chip-x" id="home" aria-label="Back to title" hidden>☰</button>
<button class="iconbtn chip-x" id="mute" aria-label="Toggle sound">♪</button>
<div id="hud" hidden>
  <div class="gauge left chip-x"><span>DEPTH</span><b id="hDepth">0m</b></div>
  <div class="pipsbox"><div id="pips"></div><span id="hPrompt"></span></div>
  <div class="gauge right chip-x"><span>SCORE</span><b id="hScore">0</b></div>
</div>
<main id="stage"></main>
<div id="dock" hidden></div>
<div id="np" class="chip-x" hidden></div>
<script>

    if (major) rctx.fillText(d ? `-${d.toLocaleString()}m` : "0m", 46, y + 4);

  if (W.cam > 1 && G && !$("#hud").hidden) {

    rctx.beginPath(); rctx.moveTo(70, y - 6); rctx.lineTo(62, y + 1); rctx.lineTo(70, y + 7); rctx.fill();

function camTo(to, dur, done) {

// the two editions sit side by side on the Desktop, so each can open the other
function gameSwitch() {

function startRound(mode, packKey) {
  const set = mode === "daily" ? dailySet(DAY) : practiceSet(packKey);
  markSeen(set);
  const seed = mode === "daily" ? DAY : Math.floor(Math.random() * 1e9);
  G = { mode, packKey, set, sim: simulate(set, seed), i: 0, answers: [], depth: 0, score: 0 };
  W.creatures = []; W.dimTo = 0;
  hud.hidden = false; $("#home").hidden = false;
  $("#hDepth").textContent = "0m"; $("#hScore").textContent = "0";
  W.onCam = c => { $("#hDepth").textContent = Math.max(0, Math.round(c)).toLocaleString() + "m"; };
  renderHUD();
  setScreen(""); setDock("");
  SND.splash();
  camTo(0, 1100, () => showPrompt());
}

function renderHUD() {
  const n = G.set.length;
  $("#pips").innerHTML = G.set.map((_, k) => {
    const a = G.answers[k];
    return `<i class="${a ? tierKey(k) : k === G.i ? "now" : ""}"></i>`;
  }).join("");
  $("#hPrompt").textContent = `PROMPT ${Math.min(G.i + 1, n)} OF ${n}`;
}

  renderHUD();
  setScreen(`<div class="pcard chip-x enter">
    <div class="eyebrow">PROMPT ${i + 1} OF ${set.length} <span>· ${esc(s.label.toUpperCase())}</span></div>
    <div class="ptext" id="ptext"></div>
    <div class="sinkhint">▼ rarer answers sink deeper ▼</div>
    <div class="fb" id="fb" aria-live="polite"></div></div>`);
  const el = $("#ptext"), text = s.q.p;
  if (STILL) el.textContent = text;
  else {
    let c = 0; const iv = T.add(setInterval(() => { c++; el.innerHTML = esc(text.slice(0, c)) + '<span class="cursor"></span>'; if (c >= text.length) { clearInterval(iv); } }, Math.max(14, 900 / text.length)));
  }
  let n = 2;
  setDock(`<div class="countchip chip-x">descending · the clock starts in <b id="cnum">${n}</b></div>`);
  SND.tick();
  T.add(setInterval(() => { n--; if (n > 0) { $("#cnum").textContent = n; SND.tick(); } else { el.textContent = text; showInput(); } }, 750));
}

function showInput() {
  T.clear();
  const C = 2 * Math.PI * 26;
  setDock(`<form class="dockrow" id="f" autocomplete="off">
      <div class="ring" id="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="rgba(8,14,28,0.9)" stroke="#1e2a44" stroke-width="5"/><circle id="rarc" cx="32" cy="32" r="26" fill="none" stroke="var(--cyan)" stroke-width="5" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b id="rnum">${LIMIT}</b></div>
      <input id="guess" aria-label="Your answer" placeholder="type an answer…" autocapitalize="off" spellcheck="false">

  const inp = $("#guess"); inp.focus();
  inp.addEventListener("input", () => SND.key());
  $("#f").onsubmit = e => { e.preventDefault(); const raw = inp.value.trim(); if (raw) guess(raw); else inp.focus(); };
  $("#pass").onclick = () => reveal(-1, "passed");
  const deadline = performance.now() + LIMIT * 1000; let lastSec = LIMIT;
  const tickFn = () => {
    if (G.locked) return;
    const left = Math.max(0, (deadline - performance.now()) / 1000), sec = Math.ceil(left);
    $("#rarc").setAttribute("stroke-dashoffset", String(C * (1 - left / LIMIT)));
    $("#rnum").textContent = sec;
    const low = left <= 5; $("#ring").classList.toggle("low", low); $("#rarc").setAttribute("stroke", low ? "var(--pink)" : "var(--cyan)");
    if (sec !== lastSec) { lastSec = sec; if (low && sec > 0) SND.low(); }
    if (left <= 0) {
      const v = inp.value.trim();
      if (v) { const m = match(G.set[G.i].q, v); if (m.idx >= 0) { G.tries++; return reveal(m.idx, "hit", v, m.fuzzy); } }
      reveal(-1, "timeout");
    }

  T.add(setInterval(tickFn, 100)); tickFn();
}

function guess(raw) {
  if (G.locked) return;
  const q = G.set[G.i].q, inp = $("#guess"), fb = $("#fb");
  G.tries++;
  const m = match(q, raw);
  if (m.idx < 0) G.wrong.push(raw);
  if (m.idx >= 0) return reveal(m.idx, "hit", raw, m.fuzzy);
  SND.wrong();
  fb.innerHTML = `✗ <b>“${esc(raw)}”</b> isn't on the list. Guess again.${m.hint ? `<span class="why">${esc(m.hint)}</span>` : ""}`;
  fb.classList.remove("in"); void fb.offsetWidth; fb.classList.add("in");
  inp.value = ""; inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.focus();
}

function reveal(idx, why, raw = "", fuzzy = false) {
  if (G.locked) return; G.locked = true; T.clear();
  const s = G.set[G.i], q = s.q, hit = idx >= 0 ? q.a[idx] : null;
  const tier = hit ? tierOf(hit.pop) : "miss", wrongs = Math.max(0, G.tries - 1), base = hit ? pts(hit.pop) : 0;
  const gain = hit ? Math.max(5, base - WRONG_COST * wrongs) : 0, m = metersOf(gain);
  G.answers[G.i] = { raw, idx, timeout: why === "timeout", tries: G.tries, fuzzy, pts: gain };
  NET.report(s, G.answers[G.i], G.wrong || []);
  const sorted = [...q.a].sort((a, b) => b.pop - a.pop);
  const fmt = p => p < 1 ? p.toFixed(1) : Math.round(p);
  const most = hit
    ? `Most said: ${esc(sorted[0].name)} (${fmt(sorted[0].pop)}%) · ${q.a.length} accepted answers`
    : `Accepted answers included ${sorted.slice(0, 3).map(a => esc(a.name)).join(", ")} and the deep cut ${esc(sorted[sorted.length - 1].name)}.`;
  const [zone, flav] = ZONE[tier];
  setScreen(`<div class="reveal">
      <img class="creature glow-${tier}" src="${spriteURL(tier)}" alt="">
      <div class="zone c-${tier} glow-${tier}">${zone}</div>
      ${hit ? `<div class="quote">“${esc(hit.name)}”</div>` : `<div class="quote">${why === "timeout" ? "Time's up" : "Passed"}</div>`}
      <div class="gain c-${tier}">+${gain} PTS <span>· sink ${m.toLocaleString()}m</span></div>
      ${hit && wrongs ? `<div class="flav c-miss">${base} − ${WRONG_COST * wrongs} for ${wrongs} wrong guess${wrongs > 1 ? "es" : ""}</div>` : ""}
      <div class="flav">${hit ? `${fmt(hit.pop)}% of players said this. ${flav}` : flav}<br><small>${q.players ? `Based on ${q.players.toLocaleString()} real player${q.players > 1 ? "s" : ""}` : "No players yet"} · starting shares: ${q.src ? esc(q.src) : "estimated"}</small></div>
      <div class="most">${most}</div></div>`);
  if (hit) {
    SND.win(tier); if (m) T.add(setTimeout(() => SND.sink(m), 250));
    W.creatures.push({ k: tier, d: G.depth + m + 40, x: Math.floor(W.w * (0.62 + Math.random() * 0.22)), glow: { common: "rgba(79,214,236,0.35)", uncommon: "rgba(183,140,255,0.35)", rare: "rgba(255,92,138,0.4)", legendary: "rgba(255,181,71,0.45)" }[tier] });

  countUp($("#hScore"), oldScore, G.score, 900);
  if (m) camTo(G.depth, 1200 + Math.min(1400, m));
  renderHUD();
  const last = G.i === G.set.length - 1;
  setDock(`<button class="descend chip-x" id="next">${last ? "SURFACE RESULTS ▲" : "DESCEND ▼"}</button>`);
  const nx = $("#next"); T.add(setTimeout(() => nx.focus(), 50));
  nx.onclick = () => { if (last) finish(); else { G.i++; showPrompt(); } };
}

function finish() {
  if (G.mode === "daily") {
    store.set(KEY, { answers: G.answers });
    const st = store.get(EDITION.key + ":streak") || { n: 0, last: 0 };
    if (st.last !== DAY) store.set(EDITION.key + ":streak", { n: st.last === DAY - 1 ? st.n + 1 : 1, last: DAY });
  }
  renderResults();
}

function showSavedDaily(saved) {
  const set = dailySet(DAY);
  if (!Array.isArray(saved.answers) || saved.answers.length !== set.length) return startRound("daily");
  G = { mode: "daily", set, sim: simulate(set, DAY), i: set.length - 1, answers: saved.answers };
  G.score = G.answers.reduce((s, a, k) => s + scoreOf(set[k].q, a), 0);
  G.depth = G.answers.reduce((s, a, k) => s + metersOf(scoreOf(set[k].q, a)), 0);
  W.creatures = []; camTo(G.depth, 1800);
  renderResults();
}

// ---------- results ----------
let clipN = 0;
function curveSVG(sim, you) {
  const Wd = 640, H = 220, L = 6, R = 6, Tp = 30, B = 28, step = 5, bins = MAX / step + 1;
  const h = new Float64Array(bins);
  for (const t of sim.totals) h[Math.min(bins - 1, Math.round(t / step))]++;
  const sm = new Float64Array(bins), k = 4;
  for (let i = 0; i < bins; i++) { let s = 0, w = 0; for (let j = -3 * k; j <= 3 * k; j++) { const ii = i + j; if (ii < 0 || ii >= bins) continue; const g = Math.exp(-(j * j) / (2 * k * k)); s += h[ii] * g; w += g; } sm[i] = s / w; }
  const ymax = Math.max(...sm);
  const x = v => L + v / MAX * (Wd - L - R), y = c => H - B - c / ymax * (H - B - Tp);
  let line = ""; for (let i = 0; i < bins; i++) line += `${i ? "L" : "M"}${x(i * step).toFixed(1)},${y(sm[i]).toFixed(1)} `;
  const area = `${line}L${x(MAX)},${H - B} L${x(0)},${H - B} Z`, id = "c" + (++clipN);
  let ticks = ""; for (let v = 0; v <= MAX; v += 100) { if (you != null && Math.abs(v - you) < 35) continue; ticks += `<line x1="${x(v)}" x2="${x(v)}" y1="${H - B}" y2="${H - B + 4}" stroke="var(--muted)"/><text x="${x(v)}" y="${H - B + 18}" text-anchor="middle">${v}</text>`; }
  const ux = you != null ? x(you) : 0, uy = you != null ? y(sm[Math.min(bins - 1, Math.round(you / step))]) : 0;
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Bell curve of simulated scores with your score marked">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--cyan)" stop-opacity="0.45"/><stop offset="1" stop-color="var(--cyan)" stop-opacity="0.02"/></linearGradient>
    <clipPath id="${id}"><rect x="0" y="0" width="${ux}" height="${H}"/></clipPath></defs>
    <path d="${area}" fill="var(--cyan)" fill-opacity="0.05"/>
    <path d="${area}" fill="url(#g${id})" clip-path="url(#${id})"/>
    <path d="${line}" fill="none" stroke="var(--cyan)" stroke-width="3"/>
    <line x1="${L}" x2="${Wd - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)" stroke-width="2"/>${ticks}
    <line x1="${x(sim.mean)}" x2="${x(sim.mean)}" y1="${y(ymax) + 22}" y2="${H - B}" stroke="var(--ink)" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <text x="${x(sim.mean)}" y="${y(ymax) + 14}" text-anchor="middle">AVG JOE</text>
    <line x1="${ux}" x2="${ux}" y1="${uy}" y2="${H - B}" stroke="var(--pink)" stroke-width="3"/>
    <rect x="${ux - 5}" y="${uy - 5}" width="10" height="10" fill="var(--pink)"/>
    <text class="you" x="${ux}" y="${H - B + 18}" text-anchor="middle">YOU</text></svg>`;
}
function depthSVG() {
  const { set, answers } = G, Wd = 640, H = 300, L = 46, R = 10, Tp = 34, B = 18, cw = (Wd - L - R) / set.length;
  const y = m => Tp + Math.sqrt(Math.min(m, 3200) / 3200) * (H - Tp - B);
  let g = "";
  for (const d of [0, 200, 800, 1800, 3200]) g += `<line x1="${L}" x2="${Wd - R}" y1="${y(d)}" y2="${y(d)}" stroke="var(--line)" stroke-dasharray="${d ? "3 6" : "0"}" stroke-width="${d ? 1 : 2}"/><text x="${L - 8}" y="${y(d) + 4}" text-anchor="end">${d ? "-" + d : 0}m</text>`;
  const cols = set.map((s, k) => {
    const x = L + (k + 0.5) * cw, a = answers[k], tier = tierKey(k);
    const lab = `<text x="${x}" y="${Tp - 14}" text-anchor="middle">${G.mode === "pack" ? "Q" + (k + 1) : s.short}</text>`;
    if (tier === "miss") return lab + `<image href="${spriteURL("miss")}" x="${x - 12}" y="${y(0) + 6}" width="24" height="19" style="image-rendering:pixelated" opacity="0.7"/>`;
    const m = metersOf(scoreOf(s.q, a)), spr = SPRITE[tier], sw = spr.width * 2.4, sh = spr.height * 2.4;
    return lab + `<line x1="${x}" x2="${x}" y1="${y(0)}" y2="${y(m) - sh / 2}" stroke="var(--t-${tier})" stroke-opacity="0.6" stroke-width="1.5"/>
      <image href="${spriteURL(tier)}" x="${x - sw / 2}" y="${y(m) - sh / 2}" width="${sw}" height="${sh}" style="image-rendering:pixelated;filter:drop-shadow(0 0 6px var(--t-${tier}))"/>`;

}
function blurb(pct) {
  if (pct >= 99) return "Far tail. Joe has never heard of half your answers.";

  if (pct >= 75) return `Comfortably ahead of the ${EDITION.joeLong}.`;
  if (pct >= 50) return "Above the median Joe, but not by much.";
  if (pct >= 25) return "Just under the median. Riskier answers would have paid.";

function renderResults() {

  setScreen(`<div class="results enter">

    <div class="bigscore"><b id="bs">0</b><span>-${sunk.toLocaleString()}m deep</span></div>

      <div class="topics">${set.map((s, k) => `<div class="trow"><span>${G.mode === "pack" ? "Prompt " + (k + 1) : esc(s.label)}</span>
        <div class="track"><div class="you" style="width:${per[k]}%"></div><div class="joe" style="left:calc(${sim.topicMean[k].toFixed(1)}% - 1px)"></div></div>

        const rarest = [...q.a].sort((x, y) => x.pop - y.pop).slice(0, 3).map(x => x.name).join(", ");
        return `<div class="rv"><img src="${spriteURL(tier)}" alt=""><div class="q">${esc(q.p)}</div>
          <div class="a">You: ${hit ? esc(hit.name) : a.timeout ? "time ran out" : "passed"}${a.tries > 1 ? ` · ${a.tries} tries` : ""} · Rarest: ${esc(rarest)}</div>
          <div class="p c-${tier}">+${per[k]}</div></div>`;
      }).join("")}</div></section></div>`, "scroll");
  countUp($("#bs"), 0, total, 1200);
  $("#copy").onclick = async e => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(share); b.textContent = "COPIED"; }
    catch { const r = document.createRange(); r.selectNodeContents($("#sharetext")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "SELECTED · CTRL+C"; }
  };
  $("#again").onclick = () => startRound("unlimited");
  $("#packs2").onclick = () => renderTitle(true);
}

// ---------- now playing (from Sally on this laptop) ----------
const NP = { el: $("#np"), track: null, at: 0, fails: 0 };
async function pollNowPlaying() {
  try {
    const r = await fetch("http://127.0.0.1:47823/now-playing", { cache: "no-store" });
    const j = await r.json();
    NP.fails = 0; NP.track = j.track; NP.at = performance.now() - Math.max(0, (j.now - j.updated) * 1000);
    paintNowPlaying(true);
  } catch { NP.fails++; NP.track = null; paintNowPlaying(true); }
  setTimeout(pollNowPlaying, NP.fails > 3 ? 15000 : 3000);
}
function paintNowPlaying(full) {
  const t = NP.track;
  NP.el.hidden = !t;
  if (!t) return;
  if (full && NP.el.dataset.id !== t.id + t.is_playing) {
    NP.el.dataset.id = t.id + t.is_playing;
    NP.el.innerHTML = `${t.art_url ? `<img src="${esc(t.art_url)}" alt="">` : "<i></i>"}<div class="npt"><span class="npl">${t.is_playing ? "NOW PLAYING" : "PAUSED"}</span><b>${esc(t.title)}</b><span>${esc(t.subtitle || "")}</span><div class="npbar"><i id="npfill"></i></div></div>`;
    NP.el.classList.toggle("paused", !t.is_playing);
  }
  const f = $("#npfill");
  if (f && t.duration_ms) {
    const prog = Math.min(t.duration_ms, t.progress_ms + (t.is_playing ? performance.now() - NP.at : 0));
    f.style.width = (prog / t.duration_ms * 100).toFixed(2) + "%";
  }
}
setInterval(() => paintNowPlaying(false), 500);
pollNowPlaying();

// ---------- controls + boot ----------
$("#home").onclick = () => renderTitle(false);
const muteBtn = $("#mute");
const paintMute = () => { muteBtn.textContent = SND.on ? "♪" : "✕"; muteBtn.setAttribute("aria-label", SND.on ? "Mute sound" : "Unmute sound"); };
muteBtn.onclick = () => { SND.on = !SND.on; store.set(EDITION.key + ":sound", SND.on); paintMute(); if (SND.on) SND.tick(); };
paintMute();
addEventListener("resize", worldResize);
worldResize();
W.cam = titleCam();
requestAnimationFrame(frame);
renderTitle(false);

// ---------- real player data ----------
// Every finished question is sent to the Stack Rank server. The counts that come back replace the
// starting shares: each answer's share is (real picks + K × prior share) / (players + K), so the
// published starting numbers fade out as real players arrive.
const NET = (() => {
  const base = location.protocol.startsWith("http") ? "" : EDITION.api || null;
  const K = 25;
  let client = store.get(EDITION.key + ":client");
  if (!client) { client = Array.from({ length: 16 }, () => Math.floor(Math.random() * 36).toString(36)).join(""); store.set(EDITION.key + ":client", client); }
  const all = () => Object.values(BANK).flat();
  all().forEach(q => q.a.forEach(a => a.prior = a.pop));
  function apply(stats) {
    if (!stats) return;
    for (const q of all()) {
      const s = stats[q.sid]; if (!s) continue;
      const hits = Object.values(s.answers).reduce((t, c) => t + c, 0);
      q.a.forEach(a => a.pop = ((s.answers[a.name] || 0) + K * a.prior / 100) / (hits + K) * 100);
      q.players = s.n;
      if (s.n >= 20) q.know = (hits + K * q.knowPrior) / (s.n + K);
    }
  }
  all().forEach(q => q.knowPrior = q.know || 0.8);
  apply(store.get(EDITION.key + ":stats"));
  if (base !== null) fetch(base + "/api/stats").then(r => r.ok ? r.json() : null).then(s => {
    if (!s) return;
    store.set(EDITION.key + ":stats", s);
    if (!G) apply(s);                       // never change shares in the middle of a round
  }).catch(() => { });
  return {
    report(s, a, wrong) {
      if (base === null) return;
      fetch(base + "/api/answer", {
        method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ client, sid: s.q.sid, answer: a.idx >= 0 ? s.q.a[a.idx].name : null, raw: a.raw, wrong, tries: a.tries, mode: G.mode, day: DAY })
      }).catch(() => { });
    }
  };
})();
</script>
